<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomit Guard</title>
  <style>
    :root {
      --bg: #0d0f12;
      --surface: #161a20;
      --border: #252a33;
      --accent: #e8ff57;
      --accent2: #57ffe8;
      --text: #e4e8ef;
      --muted: #7a8190;
      --danger: #ff5f57;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      padding: 1.2rem;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .logo {
      font-family: var(--mono);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
    }

    .logo span { color: var(--accent2); }

    .sub {
      margin-top: 0.12rem;
      font-family: var(--mono);
      font-size: 0.58rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    .status-badge {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 700;
      border: 1px solid;
      border-radius: 999px;
      padding: 0.28rem 0.7rem;
    }

    .status-badge.on {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(232, 255, 87, 0.07);
    }

    .status-badge.off {
      color: var(--muted);
      border-color: var(--border);
    }

    .status-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.8rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.4rem 0.75rem;
      align-items: center;
    }

    .label {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .value {
      font-family: var(--mono);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      text-align: right;
    }

    .divider { height: 1px; background: var(--border); }

    .btn {
      width: 100%;
      border: none;
      border-radius: 5px;
      padding: 0.7rem;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .btn-primary { background: var(--accent); color: #0d0f12; }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }

    .mode-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .mode-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.55rem 0.35rem;
    }

    .mode-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d0f12;
    }

    .settings-row label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.72rem;
    }

    input[type="number"] {
      width: 70px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.8rem;
      padding: 0.32rem 0.45rem;
      text-align: right;
      outline: none;
    }

    input[type="number"]:focus { border-color: var(--accent); }
    input[type="number"]:disabled { opacity: 0.45; }

    .pomit-link {
      color: var(--accent2);
      font-family: var(--mono);
      font-size: 0.62rem;
      text-align: center;
      text-decoration: none;
      opacity: 0.75;
    }

    .pomit-link:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="logo">Po<span>mit</span> Guard</div>
      <div class="sub">SABORI GUARD</div>
    </div>
    <div class="status-badge off" id="status-badge">OFF</div>
  </div>

  <div class="status-panel">
    <div class="label">状態</div>
    <div class="value" id="status-text">監視停止中</div>
    <div class="label">検知回数</div>
    <div class="value" id="stat-sabori">0</div>
  </div>

  <button class="btn btn-primary" id="btn-toggle">● ONにする</button>

  <div class="divider"></div>

  <div class="mode-row">
    <button class="mode-btn active" id="mode-notify">通知</button>
    <button class="mode-btn" id="mode-block">ブロック</button>
  </div>

  <div class="settings-row">
    <label>
      通知まで（秒）
      <input type="number" id="inp-detect" value="10" min="5" max="3600" />
    </label>
  </div>

  <button class="btn btn-ghost" id="btn-reset">検知回数をリセット</button>

  <div class="divider"></div>

  <a class="pomit-link" href="https://y-osaka0123.github.io/pomit/" target="_blank">↗ Pomit を開く</a>

  <script src="popup.js"></script>
</body>
</html>
